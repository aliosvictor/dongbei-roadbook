project:
  type: website
  output-dir: _site
  resources:
    - figures/maps/**
    - assets/fonts/**

website:
  title: "大兴安岭自驾游"
  description: "2026 年 9 月 26 日至 10 月 3 日东北摄影自驾路书"
  navbar:
    pinned: true
    background: "#243329"
    foreground: "#fffaf0"
    left:
      - href: index.qmd
        text: 行程
      - href: sources.qmd
        text: 临行核验
  page-footer:
    left: "2026 大兴安岭自驾游"
    right: "路线图为行程示意；实际驾驶以实时导航、交警信息和现场标识为准"
  search: true
  back-to-top-navigation: true

format:
  html:
    title-block-banner: true
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-location: right
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true
    fig-align: center

execute:
  freeze: auto
