project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - figures/maps/**
    - assets/fonts/web/**

website:
  title: "大兴安岭自驾游"
  site-url: "https://aliosvictor.github.io/dongbei-roadbook/"
  repo-url: "https://github.com/aliosvictor/dongbei-roadbook"
  description: "2026 年 9 月 26 日至 10 月 3 日大兴安岭摄影自驾路书"
  navbar:
    pinned: true
    background: "#243329"
    foreground: "#fffaf0"
    left:
      - href: index.qmd
        text: 总行程
      - href: primary.qmd
        text: 主行程
      - href: option-skip-qiqian.qmd
        text: 方案1
      - href: option-reverse.qmd
        text: 方案2
      - href: sources.qmd
        text: 核验
  page-footer:
    left: "2026 大兴安岭自驾游"
    right: "路线图为行程示意；实际驾驶以实时导航、交警信息和现场标识为准"
  search: false
  back-to-top-navigation: true

format:
  html:
    title-block-banner: true
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    toc-title: ""
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true
    fig-align: center
